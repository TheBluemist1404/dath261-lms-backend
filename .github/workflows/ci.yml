name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: datn261_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d datn261_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/datn261_test
      JWT_ACCESS_SECRET: secret-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test database
        run: pnpm prisma db push

      - name: Quality gate
        run: pnpm run ci

      - name: Check migrations match the schema
        env:
          SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/datn261_shadow
        run: |
          PGPASSWORD=test psql -h localhost -U test -d datn261_test -c 'CREATE DATABASE datn261_shadow'
          pnpm db:check-migrations

      - name: Smoke test the production build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/datn261_smoke
          PORT: 3001
        run: |
          PGPASSWORD=test psql -h localhost -U test -d datn261_test -c 'CREATE DATABASE datn261_smoke'
          pnpm db:deploy
          pnpm db:seed:dev
          NODE_ENV=production pnpm start:prod > start-prod.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:3001/health && break
            sleep 1
          done
          curl -sf http://localhost:3001/health
          curl -sf -X POST http://localhost:3001/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@dath261.dev","password":"password123"}' > /dev/null

      - name: Show the production server log
        if: failure()
        run: cat start-prod.log || true
